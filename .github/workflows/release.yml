name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Build Binaries
      run: |
        # Linux amd64
        GOOS=linux GOARCH=amd64 go build -v -o axon-linux-amd64 .
        
        # Windows amd64
        GOOS=windows GOARCH=amd64 go build -v -o axon-windows-amd64.exe .
        
        # macOS Intel amd64
        GOOS=darwin GOARCH=amd64 go build -v -o axon-darwin-amd64 .
        
        # macOS Apple Silicon arm64
        GOOS=darwin GOARCH=arm64 go build -v -o axon-darwin-arm64 .

    - name: Upload binaries to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          axon-linux-amd64
          axon-windows-amd64.exe
          axon-darwin-amd64
          axon-darwin-arm64
        prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') || contains(github.ref, '-dev') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
